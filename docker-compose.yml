version: '3.8'

services:
  enviroscan-dashboard:
    build: .
    container_name: enviroscan
    ports:
      - "8501:8501"
    environment:
      - OPENWEATHER_KEY=${OPENWEATHER_KEY}
    env_file:
      - .env
    volumes:
      - ./Dataset:/app/Dataset:ro
      - ./Models:/app/Models:ro
      - ./Images:/app/Images:ro
      - ./Model_5_Geospatial/html_exports:/app/Model_5_Geospatial/html_exports:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
